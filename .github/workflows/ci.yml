name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check app tests migrations deploy
      - run: ruff format --check app tests migrations deploy
      - run: pytest --cov=app --cov-report=term-missing
      - run: node --check app/static/app.js
      - run: bash -n deploy/k8s/cluster-addons.sh deploy/aws/production/*.sh
      - run: python -m json.tool deploy/aws/production/aws-load-balancer-controller-policy.json > /dev/null

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agentic-platform:test .
      - run: docker build -f deploy/backup/Dockerfile -t agentic-platform-operations:test .
      - run: docker compose config -q

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - run: terraform fmt -check -recursive deploy/aws
      - run: terraform -chdir=deploy/aws/state-backend init -backend=false
      - run: terraform -chdir=deploy/aws/state-backend validate
      - run: terraform -chdir=deploy/aws/production init -backend=false
      - run: terraform -chdir=deploy/aws/production validate
