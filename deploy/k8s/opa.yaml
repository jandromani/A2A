apiVersion: v1
kind: ConfigMap
metadata:
  name: a2a-opa-policy
  namespace: a2a
data:
  agentic.rego: "@@OPA_POLICY@@"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: a2a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opa
          image: openpolicyagent/opa:1.5.1
          args: [run, --server, --addr=0.0.0.0:8181, /policy/agentic.rego]
          ports:
            - name: http
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health?plugins
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: policy
              mountPath: /policy
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: a2a-opa-policy
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: a2a
spec:
  type: ClusterIP
  selector:
    app: opa
  ports:
    - name: http
      port: 8181
      targetPort: http
