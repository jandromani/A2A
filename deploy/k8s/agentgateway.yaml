apiVersion: v1
kind: ConfigMap
metadata:
  name: a2a-agentgateway
  namespace: a2a
data:
  config.yaml: |
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    llm:
      port: 4000
      models:
        - name: "*"
          provider:
            custom:
              formats:
                - type: completions
          params:
            model: "@@MODEL_NAME@@"
            apiKey: "$MODEL_API_KEY"
            baseUrl: "@@MODEL_UPSTREAM_BASE_URL@@"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: a2a
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: agentgateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: agentgateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: agentgateway
      containers:
        - name: agentgateway
          image: cr.agentgateway.dev/agentgateway:v1.6.0
          imagePullPolicy: IfNotPresent
          args: ["-f", "/etc/agentgateway/config.yaml"]
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                name: a2a-agentgateway-model
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/agentgateway
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: a2a-agentgateway
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  namespace: a2a
spec:
  type: ClusterIP
  selector:
    app: agentgateway
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentgateway
  namespace: a2a
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: agentgateway
