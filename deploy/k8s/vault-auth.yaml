apiVersion: v1
kind: ServiceAccount
metadata:
  name: a2a-vault-token-reviewer
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: a2a-vault-token-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: a2a-vault-token-reviewer
    namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: a2a-vault-token-reviewer-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: a2a-vault-token-reviewer
type: kubernetes.io/service-account-token
