apiVersion: v1
kind: ServiceAccount
metadata:
  name: a2a-runtime
  namespace: a2a
automountServiceAccountToken: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: a2a-data-lake
  namespace: a2a
spec:
  accessModes: [ReadWriteMany]
  storageClassName: "@@STORAGE_CLASS@@"
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a2a-api
  namespace: a2a
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: a2a-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: a2a-api
    spec:
      serviceAccountName: a2a-runtime
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: a2a-api
      containers:
        - name: api
          image: "@@A2A_IMAGE@@"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: a2a-platform
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data-lake
              mountPath: /var/lib/a2a/lake
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data-lake
          persistentVolumeClaim:
            claimName: a2a-data-lake
---
apiVersion: v1
kind: Service
metadata:
  name: a2a-api
  namespace: a2a
spec:
  type: ClusterIP
  selector:
    app: a2a-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: a2a-api
  namespace: a2a
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "@@PUBLIC_CERTIFICATE_ARN@@"
    alb.ingress.kubernetes.io/healthcheck-path: /ready
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/load-balancer-attributes: deletion_protection.enabled=true,routing.http2.enabled=true
spec:
  ingressClassName: alb
  rules:
    - host: "@@PUBLIC_HOST@@"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: a2a-api
                port:
                  name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: a2a-api
  namespace: a2a
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: a2a-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: a2a-api
  namespace: a2a
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: a2a-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a2a-event-worker
  namespace: a2a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: a2a-event-worker
  template:
    metadata:
      labels:
        app: a2a-event-worker
    spec:
      serviceAccountName: a2a-runtime
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "@@A2A_IMAGE@@"
          imagePullPolicy: IfNotPresent
          command: [python, -m, app.worker]
          envFrom:
            - configMapRef:
                name: a2a-platform
          env:
            - name: EVENT_WORKER_ENABLED
              value: "true"
            - name: EVENT_CONSUMER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data-lake
              mountPath: /var/lib/a2a/lake
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data-lake
          persistentVolumeClaim:
            claimName: a2a-data-lake
